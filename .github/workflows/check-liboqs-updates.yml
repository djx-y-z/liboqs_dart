# Automatically check for new liboqs releases and create PR to update pubspec.yaml
#
# This workflow:
# 1. Runs daily (or manually) to check for new liboqs releases
# 2. Compares with current liboqs.native_version in pubspec.yaml
# 3. If newer version found, updates pubspec.yaml and creates a PR
# 4. After merge, manual steps are needed (see PR description)

name: Check liboqs Updates

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if version is the same'
        required: false
        default: false
        type: boolean
      target_version:
        description: 'Specific version to update to (leave empty for latest)'
        required: false
        default: ''
        type: string

jobs:
  check-updates:
    runs-on: ubuntu-latest
    # All writes (checkout push, PR creation, branch push) go through the App
    # token; the default GITHUB_TOKEN needs no write access here.
    permissions:
      contents: read

    steps:
      # `client-id` fed from `vars.APP_ID` is not a mismatch: the action collapses
      # `client-id || app-id` into one value and passes it as the JWT `iss` claim,
      # which GitHub accepts as either the numeric App ID or the `Iv23…` client ID.
      # So the variable keeps its name and value; only the deprecated input key
      # changes. Same edit in build-liboqs.yml — keep both in sync.
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Check for updates
        id: check
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          # Build arguments
          ARGS="--ci"

          if [ -n "$TARGET_VERSION" ]; then
            # The value is interpolated into ARGS and reaches the recipe shell
            # through `make ARGS=...` before the Dart checker ever validates it,
            # so a `;` in it would run as a second command. Reject anything that
            # is not the exact upstream tag form here as well.
            if [[ ! "$TARGET_VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::target_version must be a plain X.Y.Z liboqs tag (optionally v-prefixed, optionally with a prerelease suffix)."
              exit 2
            fi
            ARGS="$ARGS --version $TARGET_VERSION"
          fi

          if [ "$FORCE_UPDATE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: make check ARGS=\"$ARGS\""
          # `|| true` is unavoidable: the checker exits 1 to signal "update
          # available", and GNU make collapses any non-zero recipe status into its
          # own exit 2, so the exit code cannot tell that apart from a crash.
          make check ARGS="$ARGS" || true

          # What can tell them apart is the outputs file: the checker writes it
          # before signalling, and not at all when it throws. Without this gate a
          # broken checker (rate limit, API change, network) looks exactly like
          # "already up to date" and the workflow stays green forever while
          # silently never opening another update PR.
          if ! grep -q '^needs_update=' "$GITHUB_OUTPUT"; then
            echo "::error::Update checker wrote no result — it failed before reporting. Check the step log above; do NOT read this as 'up to date'."
            exit 1
          fi

          echo "Check completed. Outputs:"
          cat "$GITHUB_OUTPUT" || true

      # Idempotency gate: if an open update PR for this exact version already
      # exists, do nothing. peter-evans/create-pull-request force-pushes the PR
      # branch on every run, so without this gate each scheduled run would wipe
      # any manual commits a maintainer pushed onto the open PR (e.g. regenerated
      # bindings, changelog edits). force_update bypasses the gate.
      - name: Check for existing update PR
        id: existing
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          BRANCH="update-liboqs-${LATEST_VERSION}"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" != "0" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Open update PR for branch $BRANCH already exists — skipping to avoid force-pushing over it."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pubspec.yaml
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          # Build arguments for update
          ARGS="--update --ci"

          if [ -n "$TARGET_VERSION" ]; then
            # Same guard as the check step above: this step interpolates the input
            # into a make recipe too, and a job can be re-run from this point.
            if [[ ! "$TARGET_VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::target_version must be a plain X.Y.Z liboqs tag (optionally v-prefixed, optionally with a prerelease suffix)."
              exit 2
            fi
            ARGS="$ARGS --version $TARGET_VERSION"
          fi

          if [ "$FORCE_UPDATE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: make check ARGS=\"$ARGS\""
          make check ARGS="$ARGS"

      # The notice inventory is derived from the liboqs sources at
      # liboqs.native_version, so the bump above invalidates it. Regenerated
      # here because this is the only place it can be: test.yml deliberately
      # skips `update-liboqs-*` branches (they raise the version before the
      # native libraries exist), so the verify step never runs on this PR and
      # would otherwise first fail on main after the merge.
      #
      # Not fatal on its own: a failure here still leaves a reviewable PR, and
      # the notice says what to run. It is a hard gate before the native build
      # and before either release, which is where a stale file would matter.
      - name: Regenerate third-party notices
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          if ! make third-party-notices; then
            echo "::warning::THIRD_PARTY_NOTICES.txt is now STALE: it still describes the previous liboqs version. The generator failed above — most likely this liboqs release vendors a licence it does not recognise, which is deliberate and needs a person. Run 'make third-party-notices' on this branch and read the error. Do NOT merge as-is: the native build and both releases refuse a stale inventory, and the failure will surface two workflows away from this one."
            {
              echo "## Third-party notices are stale"
              echo ""
              echo "\`THIRD_PARTY_NOTICES.txt\` could not be regenerated for this bump and still describes the previous liboqs version."
              echo "Run \`make third-party-notices\` on this branch and read the error before merging."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Records the liboqs dependency change in the CHANGELOG (Highlights +
      # Changed entry under [Unreleased]) so the update PR ships with a draft
      # entry for the maintainer to review. Does NOT bump the Dart package
      # version — that happens at release time (`make release`). Failure is
      # non-fatal: the PR is still created, with a warning to update manually.
      - name: Update CHANGELOG.md
        id: changelog
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        env:
          AI_MODELS_TOKEN: ${{ secrets.AI_MODELS_TOKEN }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
        run: |
          if make update-changelog ARGS="--version $LATEST_VERSION --from $CURRENT_VERSION --ci"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AI changelog update failed. Please update CHANGELOG.md manually."
          fi

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: |
            chore(deps): update liboqs native_version to ${{ steps.check.outputs.latest_version }}
          title: "Update liboqs to ${{ steps.check.outputs.latest_version }}"
          body: |
            ## Automated liboqs Update

            This PR updates the liboqs native library version in pubspec.yaml.

            ### Version Change

            | Component | Old | New |
            |-----------|-----|-----|
            | liboqs | ${{ steps.check.outputs.current_version }} | ${{ steps.check.outputs.latest_version }} |

            ${{ steps.check.outputs.is_prerelease == 'true' && '> **Pre-release**: This is a release candidate. Consider waiting for stable release unless you need specific features.' || '' }}

            ### Release Notes

            See [liboqs ${{ steps.check.outputs.latest_version }} release notes](${{ steps.check.outputs.release_url }})

            ### Before Merging (on this PR branch)

            Merging no longer builds anything by itself, so finish the update here first:

            1. **Regenerate FFI bindings (if API changed):**
               ```bash
               make regen
               ```

            2. **Update README.md badge** (line 9):
               ```markdown
               [![liboqs](https://img.shields.io/badge/liboqs-${{ steps.check.outputs.latest_version }}-blue.svg)](https://github.com/open-quantum-safe/liboqs)
               ```

            3. **Check `THIRD_PARTY_NOTICES.txt`** — this PR regenerates it for
               the new liboqs sources. Review the diff: a new or changed licence
               there is a real change in what the shipped binary contains. If the
               step failed, run it yourself:
               ```bash
               make third-party-notices
               ```

            4. **Review the CHANGELOG entry** — this PR includes an
               AI-generated `[Unreleased]` entry (when generation succeeded);
               verify it against the upstream release notes and edit as needed

            5. **Run tests to verify:**
               ```bash
               make test
               ```

            6. **Commit and push to this branch:**
               ```bash
               git add .
               git commit -m "chore: regenerate bindings and update docs for liboqs ${{ steps.check.outputs.latest_version }}"
               git push
               ```

            ### After Merge

            The native build is **tag-triggered** — it does NOT start on merge. From an up-to-date `main`:

            1. **Trigger the native build:**
               ```bash
               make release-native
               ```
               This creates and pushes the signed tag `liboqs-${{ steps.check.outputs.latest_version }}-<native_build>`, which starts `build-liboqs.yml`.

            2. **Wait for build completion**: Monitor the [Actions](../../actions) page until the build succeeds and the Release is published.

            3. **Release the package** when ready: `make release ARGS="--version X.Y.Z"` (see the release-package skill).

            ---
            *This PR was created automatically by the liboqs update checker.*
          branch: update-liboqs-${{ steps.check.outputs.latest_version }}
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ steps.check.outputs.is_prerelease == 'true' && 'pre-release' || '' }}

      - name: Summary
        env:
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          IS_PRERELEASE: ${{ steps.check.outputs.is_prerelease }}
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
          SKIP_EXISTING: ${{ steps.existing.outputs.skip }}
        run: |
          {
            if [ "$SKIP_EXISTING" = "true" ]; then
              echo "## Update PR Already Open"
              echo ""
              echo "An open PR for **$LATEST_VERSION** already exists — nothing to do."
              echo "Re-run with \`force_update\` to regenerate it (this force-pushes the PR branch)."
            elif [ "$NEEDS_UPDATE" = "true" ]; then
              echo "## Update Available"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Current liboqs | $CURRENT_VERSION |"
              echo "| New liboqs | $LATEST_VERSION |"
              echo "| Pre-release | $IS_PRERELEASE |"
              echo ""
              echo "A pull request has been created for review."
            else
              echo "## Up to Date"
              echo ""
              echo "Current version **$CURRENT_VERSION** is the latest."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
