# Run tests on multiple platforms
#
# Triggers:
# - Manual dispatch (workflow_dispatch)
# - Push to main branch (relevant files)
# - Pull requests (relevant files) - skipped for liboqs update PRs
# - After successful build-liboqs workflow
#
# Platforms: Linux x86_64, Linux ARM64, macOS ARM64, Windows x86_64

name: Tests

on:
  workflow_dispatch:
  # '.github/**' covers CI itself: a PR that only bumps action versions (Dependabot)
  # or edits the composite actions used to run these tests would otherwise merge
  # without a single check. A pull_request run resolves test-reusable.yml and
  # .github/actions/* from the PR's merge ref, so those changes really do execute.
  # The same filter on push is what keeps it useful: PR runs can read the base
  # branch's cache scope but never the reverse, so without a main-branch run after
  # each CI change, every PR's first run starts from a cold FVM cache.
  #
  # 'hook/**', 'scripts/**' and 'Makefile' are in scope because the suite that
  # runs here covers them — test/hook/build_hook_test.dart and
  # test/scripts/release_test.dart — and because `make` is how every check is
  # invoked: a change to the Build Hook, to the release/update scripts, or to a
  # Makefile target would otherwise be the one commit its own tests do not run on.
  #
  # 'THIRD_PARTY_NOTICES.txt' and '.gitattributes' carry `make
  # verify-third-party-notices`: the notices file is what that check compares,
  # and .gitattributes decides which bytes a checkout materialises for it. Without
  # them, the one commit able to break — or repair — that check would be the one
  # commit that never runs it.
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'hook/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.gitattributes'
      - '.github/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'hook/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.gitattributes'
      - '.github/**'
  workflow_run:
    workflows: ["Build liboqs Native Libraries"]
    types:
      - completed

# Least-privilege default. The reusable test workflow declares its own
# contents: read; the coverage-badge job authenticates with GIST_TOKEN (a PAT),
# not GITHUB_TOKEN, so no write scope is needed here.
permissions:
  contents: read

jobs:
  test:
    # Skip tests for:
    # - Failed workflow_run triggers
    # - liboqs update PRs: they raise liboqs.native_version before the native
    #   libraries for it exist, so the Build Hook has nothing to download. Matched by
    #   branch name, not by author type, so that other bot PRs (Dependabot) DO run -
    #   the branch is created by check-liboqs-updates.yml
    #   (`branch: update-liboqs-<version>`); keep both in sync.
    #   `github.head_ref` is empty outside pull_request, so startsWith() is false there.
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      !startsWith(github.head_ref, 'update-liboqs-')
    uses: ./.github/workflows/test-reusable.yml
    with:
      run-coverage: true
      update-badge: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

  # publish.yml and build-liboqs.yml only ever execute during a release, so
  # nothing else looks at them beforehand. These two checks are what stands in
  # for that, and they cover different halves: actionlint reads the workflows
  # statically (expressions, needs/steps references, runner labels, the
  # reusable-workflow contract, and shellcheck over every `run:` block), while
  # check-action-pins resolves each third-party `uses:` against the GitHub API.
  # Neither substitutes for the other — actionlint is entirely offline and
  # silently disables its action checks on a ref its bundled snapshot does not
  # know, so a fabricated version or SHA passes it without a word.
  lint-workflows:
    name: Lint workflows
    # Deliberately not carrying the `update-liboqs-` skip the test job has: that
    # exists because those PRs raise native_version before the libraries exist,
    # which has nothing to do with linting YAML. Dependabot's action bumps must
    # be linted — they are much of the reason this job exists. A workflow_run
    # re-run would only re-lint an unchanged main.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      # shellcheck is preinstalled on the ubuntu runner image; actionlint picks
      # it up off PATH and lints every `run:` block with it.
      - name: Lint workflows
        run: make lint-workflows

      - name: Check action pins resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check-action-pins
